name: Build release packages

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            kind: macos
            os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - platform: macos-x86_64
            kind: macos
            os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
          - platform: windows
            kind: windows
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: linux
            kind: linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            asset_suffix: linux
          - platform: linux-arm64
            kind: linux
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            asset_suffix: linux-arm64
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must have the form MAJOR.MINOR.PATCH, for example 0.1.3' >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install Linux camera/UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-x11-0 libclang-dev libv4l-dev
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_ID: ${{ vars.APP_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          VERSION="$GITHUB_REF_NAME"
          APP="dist/ScanBarcode.app"
          bash packaging/macos/build-app.sh "target/${{ matrix.target }}/release/ScanBarcode" "$VERSION" "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/ScanBarcode")" = '${{ matrix.arch }}'
          for required in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID APP_ID APPLE_TEAM_ID; do
            if [ -z "${!required:-}" ]; then
              echo "Missing $required for macOS signing and notarization" >&2
              exit 1
            fi
          done
          if [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" != "$APP_ID" ]; then
            echo "APP_ID does not match CFBundleIdentifier" >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/scanbarcode-signing.keychain-db"
          CERTIFICATE_FILE="$RUNNER_TEMP/scanbarcode-signing.p12"
          NOTARY_JSON="$RUNNER_TEMP/scanbarcode-notary.json"
          cleanup() {
            rm -f "$CERTIFICATE_FILE" "${KEY_FILE:-}" "$NOTARY_JSON"
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -D > "$CERTIFICATE_FILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE_FILE" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          rm -f "$CERTIFICATE_FILE"
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test "$(codesign -dv --verbose=4 "$APP" 2>&1 | sed -n 's/^TeamIdentifier=//p')" = "$APPLE_TEAM_ID"
          ZIP="dist/ScanBarcode-${{ github.event.release.tag_name }}-macos-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          KEY_FILE="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          if [[ "$APPLE_API_KEY_P8" == -----BEGIN* ]]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$KEY_FILE"
          else
            printf '%s' "$APPLE_API_KEY_P8" | base64 -D > "$KEY_FILE"
          fi
          xcrun notarytool submit "$ZIP" --key "$KEY_FILE" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait --output-format json > "$NOTARY_JSON"
          jq -e '.status == "Accepted"' "$NOTARY_JSON" >/dev/null
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose "$APP"
          rm "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $stage = "dist/ScanBarcode-${{ github.event.release.tag_name }}-windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\ScanBarcode.exe" "$stage\ScanBarcode.exe"
          if ($env:WINDOWS_CERTIFICATE_BASE64 -or $env:WINDOWS_CERTIFICATE_PASSWORD) {
            if (-not $env:WINDOWS_CERTIFICATE_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
              throw "Both WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD are required for Windows signing"
            }
            $certificate = Join-Path $env:RUNNER_TEMP "scanbarcode-signing.pfx"
            try {
              [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
              $signTool = Get-Command signtool.exe -ErrorAction SilentlyContinue
              if (-not $signTool) {
                $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
                  Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
                  Sort-Object FullName -Descending |
                  Select-Object -First 1
              }
              if (-not $signTool) { throw "Windows SDK SignTool was not found" }
              $signToolPath = if ($signTool.Source) { $signTool.Source } else { $signTool.FullName }
              & $signToolPath sign /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "$stage\ScanBarcode.exe"
              if ($LASTEXITCODE -ne 0) { throw "Windows signing failed" }
              & $signToolPath verify /pa /v "$stage\ScanBarcode.exe"
              if ($LASTEXITCODE -ne 0) { throw "Windows signature verification failed" }
            } finally {
              Remove-Item $certificate -ErrorAction SilentlyContinue
            }
          }
          Copy-Item "assets\scanbarcode-icon.png" "$stage\ScanBarcode.png"
          Copy-Item "LICENSE" "$stage\LICENSE"
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\ScanBarcode-${{ github.event.release.tag_name }}-windows.zip"
      - name: Package Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dist/ScanBarcode-${{ github.event.release.tag_name }}-${{ matrix.asset_suffix }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/ScanBarcode" "$STAGE/ScanBarcode"
          case '${{ matrix.arch }}' in
            x86_64) expected_machine=62 ;;
            arm64) expected_machine=183 ;;
            *) echo 'Unsupported Linux architecture' >&2; exit 1 ;;
          esac
          python3 - "$STAGE/ScanBarcode" "$expected_machine" <<'PY'
          import sys

          with open(sys.argv[1], 'rb') as binary:
              header = binary.read(20)
          if len(header) != 20 or header[:6] != b'\x7fELF\x02\x01' or int.from_bytes(header[18:20], 'little') != int(sys.argv[2]):
              raise SystemExit('Linux release binary architecture does not match the runner')
          PY
          chmod +x "$STAGE/ScanBarcode"
          cp assets/scanbarcode-icon.png "$STAGE/scanbarcode.png"
          cp packaging/linux/ScanBarcode.desktop "$STAGE/ScanBarcode.desktop"
          cp LICENSE "$STAGE/LICENSE"
          tar -C dist -czf "$STAGE.tar.gz" "$(basename "$STAGE")"
      - name: Upload package to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
  store-trigger:
    name: Prepare store publication
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Record release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: printf '%s\n' "$RELEASE_TAG" > release-tag.txt
      - uses: actions/upload-artifact@v7
        with:
          name: store-release-tag
          path: release-tag.txt
          retention-days: 7
