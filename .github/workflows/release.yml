name: Build release packages

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    if: ${{ !github.event.release.prerelease }}
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-14
            target: aarch64-apple-darwin
          - platform: windows
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux camera/UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-x11-0
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/ScanBarcode.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/ScanBarcode" "$APP/Contents/MacOS/ScanBarcode"
          chmod +x "$APP/Contents/MacOS/ScanBarcode"
          cp assets/scanbarcode-icon.png "$APP/Contents/Resources/ScanBarcode.png"
          ICONSET="dist/ScanBarcode.iconset"
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/scanbarcode-icon.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            retina=$((size * 2))
            sips -z "$retina" "$retina" assets/scanbarcode-icon.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/ScanBarcode.icns"
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/>0.1.0</>$VERSION</g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/ScanBarcode-${{ github.event.release.tag_name }}-macos.zip"
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist/ScanBarcode-${{ github.event.release.tag_name }}-windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\ScanBarcode.exe" "$stage\ScanBarcode.exe"
          Copy-Item "assets\scanbarcode-icon.png" "$stage\ScanBarcode.png"
          Copy-Item "LICENSE" "$stage\LICENSE"
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\ScanBarcode-${{ github.event.release.tag_name }}-windows.zip"
      - name: Package Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dist/ScanBarcode-${{ github.event.release.tag_name }}-linux"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/ScanBarcode" "$STAGE/ScanBarcode"
          chmod +x "$STAGE/ScanBarcode"
          cp assets/scanbarcode-icon.png "$STAGE/scanbarcode.png"
          cp packaging/linux/ScanBarcode.desktop "$STAGE/ScanBarcode.desktop"
          cp LICENSE "$STAGE/LICENSE"
          tar -C dist -czf "dist/ScanBarcode-${{ github.event.release.tag_name }}-linux.tar.gz" "ScanBarcode-${{ github.event.release.tag_name }}-linux"
      - name: Upload package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
