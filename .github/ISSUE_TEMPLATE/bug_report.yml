name: Bug report
description: Report a reproducible problem in ScanBarcode
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ScanBarcode version
      placeholder: 0.1.1
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: macOS 15, Windows 11, or Ubuntu 24.04
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ScanBarcode
        2. ...
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove private information before attaching files.
