name: dl-scanbarcode
title: ScanBarcode
base: core24
version: '0.1.3'
summary: Scan barcodes and QR codes with your camera
description: |
  Scan barcodes and QR codes from a live camera or image files.
grade: stable
confinement: strict
icon: snap/gui/scanbarcode.png
apps:
  dl-scanbarcode:
    command: bin/ScanBarcode
    desktop: usr/share/applications/scanbarcode.desktop
    extensions: [gnome]
    plugs:
      - camera
      - home
      - network
      - opengl
      - audio-playback
      - x11
      - wayland
      - desktop
      - desktop-legacy
parts:
  scanbarcode:
    plugin: dump
    source: dist/snap-stage
    organize:
      ScanBarcode: bin/ScanBarcode
      scanbarcode.desktop: usr/share/applications/scanbarcode.desktop
    stage-packages:
      - libasound2t64
      - libudev1
      - libv4l-0
